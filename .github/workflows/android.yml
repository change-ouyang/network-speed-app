name: android-apk
on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', '.github/workflows/android.yml', 'capacitor.config.json', 'package.json']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install npm deps
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Bump versionCode & versionName per CI run
        working-directory: android
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-speed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
